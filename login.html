<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> login page-spendora</title>

<link rel="stylesheet" href="bootstrap/bootstrap-5.0.2-dist/css/bootstrap.min.css">

<script src="bootstrap/bootstrap-5.0.2-dist/js/bootstrap.min.js"></script>

</head>

<body>
    
<div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <h2 class="mb-4 text-center">Contact Form</h2>

        <form>
          <!-- Text input -->
          <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
          </div>

          <!-- Email input -->
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
          </div>

          <!-- Password input -->
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
          </div>

          <!-- Select dropdown -->
          <div class="mb-3">
            <label for="course" class="form-label">Course</label>
            <select class="form-select" id="course">
              <option selected>Choose...</option>
              <option value="1">Data Science</option>
              <option value="2">Computer Science</option>
              <option value="3">Statistics</option>
            </select>
          </div>

          <!-- Radio buttons -->
          <div class="mb-3">
            <label class="form-label d-block">Gender</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="female" value="female">
              <label class="form-check-label" for="female">Female</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="male" value="male">
              <label class="form-check-label" for="male">Male</label>
            </div>
          </div>

          <!-- Textarea -->
          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="4" placeholder="Type your message"></textarea>
          </div>

          <!-- Checkbox -->
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="agree">
            <label class="form-check-label" for="agree">I agree to the terms</label>
          </div>

          <!-- Submit button -->
          <button type="submit" class="btn btn-primary w-100">Submit</button>
        </form>

      </div>
    </div>
  </div>








</body>
</html>
